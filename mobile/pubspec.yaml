name: mobile
description: "SpeakWise - AI Presentation Coach"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ==========================================================
  # ICONS
  # ==========================================================
  cupertino_icons: ^1.0.8

  # ==========================================================
  # FONTS
  # ==========================================================
  google_fonts: ^6.2.1

  # ==========================================================
  # FILE PICKER
  # ==========================================================
  file_picker: 8.3.7

  # ==========================================================
  # TEXT TO SPEECH
  # ==========================================================
  flutter_tts: ^4.2.5

  # ==========================================================
  # AUDIO RECORDING
  # ==========================================================
  record: ^6.1.2

  # ==========================================================
  # FILE PATHS
  # ==========================================================
  path_provider: ^2.1.5

  # ==========================================================
  # URL LAUNCHER / WHATSAPP SUPPORT
  # ==========================================================
  url_launcher: ^6.3.2

  # ==========================================================
  # FIREBASE
  # ==========================================================
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0

  # ==========================================================
  # HTTP
  # ==========================================================
  http: ^1.6.0
  google_sign_in: ^7.2.0
  google_sign_in_all_platforms: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ==========================================================
  # LINTS
  # ==========================================================
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ==========================================================
  # ASSETS
  # ==========================================================
  assets:
    - assets/images/logo.png
    - assets/images/jellyfish.png